baseURL = "https://go-rouge.github.io/docs/"
title = "go-rouge"
# `locale`, not `languageCode`: the latter is deprecated since Hugo v0.158.0.
# The reference site this was copied from still carries the old spelling and
# warns on every build; there is no reason to inherit that.
locale = "en"

# ⛔ Hugo + Hextra, and no Python. What this replaced was MkDocs Material plus
# mike, which needed a Python toolchain, a requirements.txt and a pip install
# in CI to render a static site for an organisation whose whole argument is
# that it needs no runtime but Go. Hugo is one binary and the theme is a Go
# module.
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

enableGitInfo = true

# ⛔ The content is NOT under content/docs. This site is served AT /docs/, so a
# `docs` section would make every page /docs/docs/… and break every internal
# link, which are written /docs/… because that is the site root here.
#
# Hextra picks its documentation layout from the section being called `docs`,
# so with the content at the root the type is cascaded instead. This is the
# trap go-pdfkit/docs hit first and recorded; it is copied here deliberately.
#
# `cascade.target`, not `cascade._target`: the latter is deprecated since Hugo
# v0.156.0.
[[cascade]]
  [cascade.params]
    type = "docs"
  [cascade.target]
    path = "/**"

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "Pure-Go syntax highlighting: Rouge/Pygments-class lexers that tokenize source and emit highlighted HTML, with no cgo and no Ruby."

  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "images/logo.svg"
      width = 24
      height = 24

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false

  [params.editURL]
    enable = true
    base = "https://github.com/go-rouge/docs/edit/main/content"

[[menu.main]]
  name = "Organisation"
  url = "https://github.com/go-rouge"
  weight = 2

[[menu.main]]
  name = "Search"
  weight = 3
  [menu.main.params]
    type = "search"

[[menu.main]]
  weight = 4
  url = "https://github.com/go-rouge"
  [menu.main.params]
    icon = "github"
